<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>winnowPro</title>
    <style>
        body {
            background: linear-gradient(135deg, #6a6d6e, #d6d4d6);
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 30px;
            background-color: #000;
            color: #fff;
        }
        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff5722;
        }
        .tagline {
            font-size: 12px;
            color: #fff;
        }
        .nav {
            display: flex;
            gap: 20px;
            font-size: 14px;
        }
        .nav a {
            text-decoration: none;
            color: #fff;
            text-transform: uppercase;
        }
        .image-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
        img {
            width: 800px;
            height: 400px;
            object-fit: cover;
        }
        .logos-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .logos-container img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 10px;
        }
        .chat-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .chat-button:hover {
            background-color: #e64a19;
        }
        .chat-window {
            position: fixed;
            bottom: 90px;
            right: 20px;
            width: 300px;
            height: 400px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background-color: #ff5722;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
        }
        .chat-body {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
        }
        .message {
            margin: 5px 0;
            padding: 8px 12px;
            border-radius: 8px;
            max-width: 80%;
        }
        .user-message {
            background-color: #d1f7c4;
            align-self: flex-end;
            text-align: right;
        }
        .bot-message {
            background-color: #f0f0f0;
            align-self: flex-start;
            text-align: left;
        }
        .chat-footer {
            display: flex;
            border-top: 1px solid #ddd;
        }
        .chat-input {
            border: none;
            padding: 10px;
            width: calc(100% - 60px);
            box-sizing: border-box;
        }
        .send-button {
            background-color: #ff5722;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            width: 50px;
        }
        .send-button:hover {
            background-color: #e64a19;
        }
        .partnerheading {

        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <span class="logo">ABC<span style="color: #fff;">DEF</span></span><br>
        <span class="tagline">GHIJKL</span>
    </div>
    <div class="nav">
        <a href="#">Automation</a>
        <a href="#">User Experience</a>
        <a href="#">Intelligence</a>
        <a href="#">Integration</a>
        <a href="#">Reports</a>
    </div>
</div>

<div class="image-container">
    <img src="static/car.jpeg" alt="Sample Image">
</div>
<div class="partnerheading" style="padding-left: 560px;">
    <span class="logo">Our <span style="color: #fff;">Partners:</span></span><br>
</div>
<div class="logos-container">
    <img src="static/ford.png" alt="Logo 1">
    <img src="static/genesis.png" alt="Logo 2">
    <img src="static/volkswagen.png" alt="Logo 3">
    <img src="static/kia.png" alt="Logo 4">
</div>

<button class="chat-button" onclick="toggleChat()">💬</button>


<div class="chat-window" id="chatWindow">
    <div class="chat-header">Chat</div>
    <div class="chat-body" id="chatBody"></div>
    <div class="chat-footer">
        <input 
            type="text" 
            class="chat-input" 
            id="chatInput" 
            placeholder="Type your message...">
        <button class="send-button" onclick="handleSend()">Send</button>
    </div>
</div>
<script>
let sessionId = null;

// Function to toggle chat window visibility
function toggleChat() {
    const chatWindow = document.getElementById('chatWindow');
    chatWindow.style.display = 
        chatWindow.style.display === 'none' ? 'flex' : 'none';

    // Fetch a new session ID if the chat is opened for the first time
    if (!sessionId) {
        fetchNewSession();
    }
}

// Function to fetch a new session ID from FastAPI backend
async function fetchNewSession() {
    const response = await fetch("http://localhost:8000/session");
    const data = await response.json();
    sessionId = data.session_id;
}

// Function to handle message send event
async function handleSend() {
    const chatInput = document.getElementById('chatInput');
    const userMessage = chatInput.value.trim();

    if (userMessage) {
        addMessageToChat(userMessage, 'user');
        chatInput.value = '';

        // Ensure sessionId is fetched before sending any message
        if (!sessionId) {
            await fetchNewSession();
        }

        // Send user message to FastAPI backend and get the bot response
        const botResponse = await sendMessageToBot(userMessage);

        // Display bot response
        addMessageToChat(botResponse.response, 'bot');
    }
}


// Function to send user message to FastAPI backend
async function sendMessageToBot(userMessage) {
    if (!sessionId) {
        console.error('Session ID is missing');
        return { response: 'Error: No session ID found.' };
    }

    const response = await fetch(`http://localhost:8000/chat/${sessionId}`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({ message: userMessage })
    });

    return response.json();
}


// Function to add message to chat window
function addMessageToChat(message, sender) {
    const chatBody = document.getElementById('chatBody');
    const messageElement = document.createElement('div');
    messageElement.className = `message ${sender}-message`;
    messageElement.textContent = message;
    chatBody.appendChild(messageElement);
    chatBody.scrollTop = chatBody.scrollHeight;
}

// Add event listener to handle 'Enter' key press
document.getElementById('chatInput').addEventListener('keypress', function(event) {
    if (event.key === 'Enter') {
        handleSend();
    }
});

</script>

</body>
</html>
